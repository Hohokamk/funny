<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="青年成长与自我探索档案：一场关于克己与自律的沉浸式认知体验。" />
  <title>青年成长与自我探索档案</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet" />

  <style>
    :root {
      --paper: #f7f5f0;
      --ink: #161616;
      --muted: #6f6f6f;
      --line: rgba(0, 0, 0, 0.12);
      --accent: #8c1f1f;
      --accent-soft: rgba(140, 31, 31, 0.09);
      --void: #000000;
      --blood: #a40b0b;
      --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
      --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --display: "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--void);
    }

    body {
      font-family: var(--sans);
      color: var(--ink);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity 620ms var(--ease-out),
        visibility 0s linear 620ms,
        filter 620ms var(--ease-out);
      will-change: opacity, filter;
    }

    .screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition-delay: 0s;
      z-index: 2;
    }

    .screen.leaving {
      opacity: 0;
      filter: saturate(0.98) blur(1.5px);
      visibility: hidden;
      pointer-events: none;
      transition: opacity 460ms ease-in, filter 460ms ease-in, visibility 0s linear 460ms;
      z-index: 3;
      overflow: hidden;
    }

    /* ===== Screen 1: archival minimalism ===== */
    .screen--one {
      background:
        radial-gradient(circle at 50% 0%, #ececec 0%, #d8d6d0 58%, #bfbeb7 130%);
      z-index: 1;
    }

    .screen--one::before,
    .screen--one::after {
      content: "";
      position: absolute;
      inset: auto;
      pointer-events: none;
    }

    .screen--one::before {
      width: 42rem;
      max-width: 90vw;
      height: 42rem;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      filter: blur(10px);
      transform: translateY(-22%);
    }

    .screen--one::after {
      left: 0;
      right: 0;
      bottom: 0;
      height: 28vh;
      background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.04));
    }

    .archive-card {
      position: relative;
      z-index: 2;
      width: min(92vw, 540px);
      padding: clamp(32px, 7vw, 58px) clamp(22px, 6vw, 56px);
      background: rgba(252, 251, 248, 0.76);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 2px;
      box-shadow:
        0 30px 80px rgba(35, 30, 22, 0.19),
        inset 0 0 0 1px rgba(0, 0, 0, 0.025);
      backdrop-filter: blur(15px);
      animation: cardIn 0.9s var(--ease-out) both;
    }

    .archive-card::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(0, 0, 0, 0.07);
      pointer-events: none;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
        filter: blur(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .archival-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
    }

    .archival-path {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--muted);
      text-transform: uppercase;
      line-height: 1.6;
    }

    .archival-number {
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--accent);
      white-space: nowrap;
      text-align: right;
    }

    .archive-card h1 {
      position: relative;
      margin: 0 0 28px;
      font-family: var(--serif);
      font-weight: 900;
      font-size: clamp(24px, 7vw, 36px);
      line-height: 1.24;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .archive-card h1::after {
      content: "";
      display: block;
      width: 58px;
      height: 3px;
      margin-top: 14px;
      background: var(--accent);
    }

    .archive-card .seal {
      position: absolute;
      right: 26px;
      top: 84px;
      width: 58px;
      height: 58px;
      border: 2px solid rgba(140, 31, 31, 0.32);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: rgba(140, 31, 31, 0.78);
      font-family: var(--serif);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      transform: rotate(-8deg);
      letter-spacing: 0.12em;
    }

    .field-group {
      position: relative;
      margin: 34px 0 14px;
    }

    .field-label {
      display: block;
      margin-bottom: 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .name-input {
      width: 100%;
      height: 56px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      font-size: 17px;
      letter-spacing: 0.08em;
      outline: none;
      transition: border-color 220ms ease, box-shadow 220ms ease, background 220ms ease;
    }

    .name-input:focus {
      border-color: rgba(140, 31, 31, 0.55);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .name-input.error {
      border-color: #b3261e;
      background: rgba(179, 38, 30, 0.04);
      animation: shake 380ms ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }

    .error-text {
      min-height: 22px;
      margin: 8px 2px 0;
      font-size: 13px;
      color: #b3261e;
      opacity: 0;
      transform: translateY(-3px);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .error-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    .open-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 58px;
      margin-top: 18px;
      border-radius: 2px;
      background: var(--ink);
      color: #f7f5f0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.18em;
      transition: transform 200ms ease, background 200ms ease, box-shadow 200ms ease;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.17);
    }

    .open-button:hover {
      background: #312d2d;
      transform: translateY(-2px);
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.23);
    }

    .open-button:active {
      transform: translateY(0);
    }

    .archive-note {
      margin-top: 22px;
      font-size: 11px;
      line-height: 1.8;
      color: var(--muted);
      text-align: center;
    }

    /* ===== Screen 2: dense label cloud ===== */
    .screen--two {
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.1), transparent 27rem),
        radial-gradient(circle at 90% 70%, rgba(126, 13, 143, 0.13), transparent 25rem),
        #0e1013;
      flex-direction: column;
      justify-content: flex-start;
      overflow-y: auto;
      padding: 0;
    }

    .screen--two.active {
      display: flex;
    }

    .screen--two::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      pointer-events: none;
      mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
    }

    .tag-screen-inner {
      position: relative;
      z-index: 2;
      width: min(96vw, 1080px);
      padding: 62px 0 80px;
      text-align: center;
      animation: tagScreenIn 0.7s var(--ease-out) both;
    }

    @keyframes tagScreenIn {
      from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .tag-screen-inner h2 {
      margin: 0 0 14px;
      padding: 0 10px;
      font-family: var(--serif);
      font-size: clamp(22px, 6vw, 38px);
      font-weight: 900;
      letter-spacing: 0.02em;
      color: #ffffff;
    }

    .tag-screen-inner .tag-subtitle {
      max-width: 640px;
      margin: 0 auto 36px;
      padding: 0 18px;
      color: rgba(255, 255, 255, 0.56);
      font-size: clamp(13px, 3vw, 16px);
      line-height: 1.9;
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 12px;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 14px;
    }

    .tag-chip {
      --hue: 240;
      --glow: hsla(var(--hue), 90%, 65%, 0.14);
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 17px;
      border: 1px solid hsla(var(--hue), 80%, 86%, 0.36);
      border-radius: 999px;
      background: hsla(var(--hue), 30%, 8%, 0.55);
      color: rgba(255, 255, 255, 0.78);
      font-size: 14px;
      letter-spacing: 0.04em;
      line-height: 1.1;
      transition:
        color 180ms ease,
        border-color 180ms ease,
        background 180ms ease,
        transform 180ms ease,
        box-shadow 220ms ease;
      user-select: none;
    }

    .tag-chip::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: radial-gradient(circle, hsla(var(--hue), 95%, 66%, 0.8) 0%, transparent 70%);
      opacity: 0;
      filter: blur(11px);
      transition: opacity 200ms ease;
      z-index: -1;
    }

    .tag-chip:hover,
    .tag-chip:focus-visible {
      color: #ffffff;
      border-color: hsla(var(--hue), 100%, 82%, 0.9);
      background: hsla(var(--hue), 50%, 16%, 0.85);
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 24px var(--glow), 0 0 60px var(--glow);
      outline: none;
    }

    .tag-chip:hover::after {
      opacity: 0.85;
    }

    .tag-chip:active {
      transform: translateY(0) scale(0.97);
    }

    .tag-chip .index {
      margin-right: 8px;
      color: hsla(var(--hue), 95%, 76%, 0.72);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .tag-hint {
      margin-top: 40px;
      color: rgba(255, 255, 255, 0.48);
      font-size: 13px;
      letter-spacing: 0.08em;
      animation: breathe 2.8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.42; }
      50% { opacity: 0.95; }
    }

    /* ===== Screen 3: neon chaos ===== */
    .screen--three {
      background: #09010f;
      z-index: 2;
      overflow: hidden;
    }

    .screen--three::before {
      content: "";
      position: absolute;
      left: -40vw;
      top: -50vh;
      width: 120vw;
      height: 180vh;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #ff3ec8,
        #9c1aff,
        #5effc8,
        #ddff00,
        #ff003c,
        #ff3ec8
      );
      filter: saturate(1.25) brightness(1.1);
      opacity: 0.4;
      animation: spinHue 8s linear infinite, colorPulse 3.4s ease-in-out infinite;
      mix-blend-mode: screen;
      will-change: transform, opacity;
      pointer-events: none;
    }

    .screen--three::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-radial-gradient(circle at center, rgba(255, 255, 255, 0.12) 0 1px, transparent 1px 7px);
      mix-blend-mode: overlay;
      opacity: 0.16;
      pointer-events: none;
    }

    @keyframes spinHue {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes colorPulse {
      0%, 100% { opacity: 0.24; filter: hue-rotate(0deg) saturate(1.2); }
      50% { opacity: 0.5; filter: hue-rotate(46deg) saturate(1.8); }
    }

    .night-city {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      height: 32vh;
      background:
        linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.88)),
        repeating-linear-gradient(100deg, rgba(255, 255, 255, 0.12) 0 1px, transparent 1px 5px);
      filter: contrast(1.1);
      opacity: 0.42;
      pointer-events: none;
      animation: cityFlicker 1.7s steps(2, end) infinite;
    }

    @keyframes cityFlicker {
      0%, 100% { opacity: 0.36; }
      50% { opacity: 0.56; }
      29% { filter: contrast(1.1) hue-rotate(0deg); }
      30% { filter: contrast(1.4) hue-rotate(-22deg); }
      60% { filter: contrast(1.3) hue-rotate(17deg); }
      61% { filter: contrast(1.1) hue-rotate(0deg); }
    }

    .particle {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 4;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: var(--color);
      box-shadow: 0 0 14px var(--color), 0 0 34px var(--color);
      opacity: var(--alpha);
      pointer-events: none;
      mix-blend-mode: screen;
      animation: floatParticle var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes floatParticle {
      0% {
        transform: translate3d(0, 103vh, 0) scale(0.45);
        opacity: 0;
      }
      12% { opacity: var(--alpha); }
      85% { opacity: var(--alpha); }
      100% {
        transform: translate3d(var(--drift), -12vh, 0) scale(1.3);
        opacity: 0;
      }
    }

    .chaos-content {
      position: relative;
      z-index: 6;
      width: min(94vw, 780px);
      text-align: center;
      padding: 20px 14px;
      animation: chaosIn 0.6s var(--ease-out) both;
    }

    @keyframes chaosIn {
      from { opacity: 0; transform: scale(0.9); filter: blur(8px); }
      to { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    .glitch-title {
      position: relative;
      display: inline-block;
      margin: 0 auto 24px;
      font-family: var(--display);
      font-size: clamp(30px, 8vw, 68px);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: 0.12em;
      color: #fff;
      text-shadow:
        2px 0 #ff00d4,
        -2px 0 #00f0ff,
        0 0 32px rgba(255, 0, 212, 0.8);
      animation: glitchJump 1.25s steps(2, jump-none) infinite;
    }

    .glitch-title::before,
    .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.8;
    }

    .glitch-title::before {
      color: #ff00d4;
      clip-path: polygon(0 0, 100% 0, 100% 36%, 0 36%);
      transform: translate(-6px, -4px);
      animation: glitchShiftA 1.1s steps(2, jump-none) infinite;
    }

    .glitch-title::after {
      color: #00f0ff;
      clip-path: polygon(0 72%, 100% 72%, 100% 100%, 0 100%);
      transform: translate(6px, 4px);
      animation: glitchShiftB 1.35s steps(2, jump-none) infinite;
    }

    @keyframes glitchJump {
      0%, 100% { transform: translate(0); filter: contrast(1.05); }
      10% { transform: translate(-3px, 1px); filter: contrast(1.35); }
      20% { transform: translate(3px, -2px); filter: contrast(1.18); }
      30% { transform: translate(-2px, -1px); filter: contrast(1.4); }
      40%, 82% { transform: translate(0); filter: contrast(1.05); }
    }

    @keyframes glitchShiftA {
      0%, 100% { transform: translate(-6px, -4px); clip-path: polygon(0 0, 100% 0, 100% 36%, 0 36%); }
      18% { transform: translate(9px, 2px); clip-path: polygon(0 44%, 100% 20%, 100% 56%, 0 67%); }
      36% { transform: translate(-10px, 5px); clip-path: polygon(0 12%, 100% 5%, 100% 33%, 0 42%); }
      54%, 88% { transform: translate(-6px, -4px); clip-path: polygon(0 0, 100% 0, 100% 36%, 0 36%); }
    }

    @keyframes glitchShiftB {
      0%, 100% { transform: translate(6px, 4px); clip-path: polygon(0 72%, 100% 72%, 100% 100%, 0 100%); }
      22% { transform: translate(-8px, -3px); clip-path: polygon(0 58%, 100% 78%, 100% 84%, 0 66%); }
      44% { transform: translate(9px, 6px); clip-path: polygon(0 82%, 100% 68%, 100% 92%, 0 86%); }
      66%, 90% { transform: translate(6px, 4px); clip-path: polygon(0 72%, 100% 72%, 100% 100%, 0 100%); }
    }

    .indulge-button {
      --edge: #ff20d7;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: min(82vw, 380px);
      min-height: 78px;
      margin-top: 24px;
      padding: 15px 28px;
      border: 2px solid transparent;
      border-radius: 8px;
      font-family: var(--display);
      font-size: clamp(24px, 7vw, 42px);
      letter-spacing: 0.18em;
      color: #ffffff;
      background:
        linear-gradient(110deg, #ff00bb, #a600ff, #00ffd5, #ffec00, #ff0015, #ff00bb);
      background-size: 420% 420%;
      background-clip: padding-box;
      box-shadow:
        0 0 18px rgba(255, 0, 220, 0.72),
        0 0 60px rgba(92, 0, 255, 0.56),
        0 0 120px rgba(0, 255, 213, 0.3),
        inset 0 0 22px rgba(255, 255, 255, 0.55);
      animation: gradientFlow 3.4s ease-in-out infinite, buttonThrob 1.7s ease-in-out infinite;
      overflow: hidden;
      text-shadow: 1px 1px rgba(0, 0, 0, 0.35);
      transition: transform 180ms ease, filter 180ms ease;
    }

    .indulge-button::before {
      content: "";
      position: absolute;
      width: 220%;
      height: 180%;
      left: -60%;
      top: -40%;
      background: conic-gradient(from 0deg, rgba(255, 255, 255, 0.5), transparent 26%, rgba(255, 255, 255, 0.6) 50%, transparent 74%, rgba(255, 255, 255, 0.5));
      animation: spinHue 3.6s linear infinite;
      opacity: 0.35;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .indulge-button span {
      position: relative;
      z-index: 2;
    }

    .indulge-button:hover {
      transform: scale(1.06);
      filter: saturate(1.7) brightness(1.18);
      box-shadow:
        0 0 34px rgba(255, 0, 220, 0.92),
        0 0 90px rgba(92, 0, 255, 0.82),
        0 0 180px rgba(0, 255, 213, 0.55),
        inset 0 0 30px rgba(255, 255, 255, 0.7);
    }

    .indulge-button:active {
      transform: scale(0.98);
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes buttonThrob {
      0%, 100% { filter: saturate(1.15) brightness(1); }
      50% { filter: saturate(1.35) brightness(1.12); }
    }

    .lure-sub {
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: clamp(12px, 3vw, 16px);
      letter-spacing: 0.16em;
      text-shadow: 0 0 14px rgba(255, 0, 255, 0.6);
    }

    .strobe-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
    }

    .strobe-overlay.run {
      animation: strobeHit 760ms steps(2, jump-none) both;
    }

    @keyframes strobeHit {
      0% { opacity: 0; }
      12% { opacity: 0.95; }
      18% { opacity: 0.2; }
      24% { opacity: 1; }
      38% { opacity: 0.35; }
      52% { opacity: 1; }
      68% { opacity: 0.6; }
      86%, 100% { opacity: 1; }
    }

    .app.shaking {
      animation: screenExplode 520ms cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes screenExplode {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-10px, 6px); }
      20% { transform: translate(9px, -8px); }
      30% { transform: translate(-13px, 9px); }
      40% { transform: translate(11px, -5px); }
      50% { transform: translate(-6px, 11px); }
      60% { transform: translate(7px, -7px); }
      70% { transform: translate(-9px, 4px); }
      80% { transform: translate(5px, 2px); }
    }

    /* ===== Screen 4: silence ===== */
    .screen--four {
      background: #000000;
      z-index: 3;
      padding: 22px;
    }

    .screen--four::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.055), transparent 36rem);
      pointer-events: none;
    }

    .doom-copy {
      position: relative;
      z-index: 2;
      width: min(94vw, 780px);
      max-height: 88vh;
      overflow-y: auto;
      padding: 26px 4px;
      text-align: center;
      color: #f2f2f0;
      animation: doomIn 1500ms var(--ease-out) both;
    }

    @keyframes doomIn {
      0% { opacity: 0; filter: blur(10px); transform: scale(0.985); }
      18% { opacity: 0.9; filter: blur(0); }
      100% { opacity: 1; transform: scale(1); }
    }

    .doom-marker {
      margin-bottom: 18px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 11px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }

    .doom-copy h1 {
      margin: 0 0 26px;
      font-family: var(--serif);
      font-weight: 900;
      font-size: clamp(42px, 13vw, 92px);
      line-height: 1;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-shadow: 0 0 44px rgba(255, 255, 255, 0.14);
    }

    .doom-line {
      width: 74px;
      height: 2px;
      margin: 0 auto 30px;
      background: var(--blood);
      box-shadow: 0 0 20px rgba(164, 11, 11, 0.65);
    }

    .doom-warning {
      font-family: var(--serif);
      font-size: clamp(16px, 4.5vw, 23px);
      font-weight: 500;
      line-height: 2.1;
      letter-spacing: 0.06em;
      white-space: pre-line;
      color: #f0eeea;
      padding: 12px 10px;
    }

    .doom-warning .name {
      color: #ffffff;
      font-weight: 900;
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-color: rgba(164, 11, 11, 0.8);
    }

    .regret-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      margin-top: 34px;
      padding: 10px 24px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 2px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.22em;
      transition: border-color 220ms ease, color 220ms ease, background 220ms ease, transform 220ms ease;
    }

    .regret-button:hover {
      border-color: rgba(255, 255, 255, 0.72);
      color: #ffffff;
      background: rgba(255, 255, 255, 0.035);
      transform: translateY(-1px);
    }

    .regret-button:active {
      transform: translateY(0);
    }

    .doom-foot {
      margin-top: 26px;
      color: rgba(255, 255, 255, 0.33);
      font-size: 11px;
      letter-spacing: 0.3em;
    }

    @media (max-width: 760px) {
      body {
        overflow: hidden;
      }

      .archive-card {
        width: 92vw;
      }

      .tag-screen-inner {
        padding: 42px 0 60px;
      }

      .tag-chip {
        min-height: 38px;
        padding: 8px 13px;
        font-size: 13px;
      }

      .glitch-title {
        font-size: clamp(30px, 10vw, 58px);
      }

      .indulge-button {
        min-width: 84vw;
        min-height: 70px;
        margin-top: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="app">

    <!-- Screen 1: 姓名输入 -->
    <section class="screen screen--one active" data-screen="1" aria-label="第一步：姓名输入">
      <form class="archive-card" id="nameForm" novalidate>
        <div class="archival-head">
          <div class="archival-path">青年成长与自我探索档案</div>
          <div class="archival-number">档案编号／NO. 00001</div>
        </div>
        <div class="seal">认知<br/>探索<br/>档案</div>
        <h1>青年成长与<br />自我探索档案</h1>
        <div class="field-group">
          <label class="field-label" for="nameInput">真实姓名</label>
          <input class="name-input" id="nameInput" name="name" type="text" maxlength="24" autocomplete="off" placeholder="请输入你的真实姓名" />
          <p class="error-text" id="nameError">请先填写你的姓名，再开启本次探索。</p>
        </div>
        <button class="open-button" type="submit">
          开启认知探索
        </button>
        <p class="archive-note">请保持诚实与安静，本档案仅供自我觉察参考。</p>
      </form>
    </section>

    <!-- Screen 2: 海量性取向选择 -->
    <section class="screen screen--two" data-screen="2" aria-label="第二步：取向标签选择">
      <div class="tag-screen-inner">
        <h2>请选择你的取向标签</h2>
        <p class="tag-subtitle">这里陈列了当代语境中常见的性取向与浪漫取向词汇。不要急着定义自己，先感受欲望如何在一堆标签里膨胀。</p>
        <div id="tagCloud" class="tag-cloud" aria-label="取向标签列表"></div>
        <p class="tag-hint">点击任意一个标签，继续进入下一章</p>
      </div>
    </section>

    <!-- Screen 3: 声色陷阱 -->
    <section class="screen screen--three" data-screen="3" aria-label="第三步：声色幻象">
      <div class="night-city" aria-hidden="true"></div>
      <div id="particleField" aria-hidden="true"></div>
      <div class="chaos-content">
        <h1 class="glitch-title" data-text="这里满足你所有的好奇与欲望……">这里满足你所有的好奇与欲望……</h1>
        <p class="lure-sub">此刻，所有想象都触手可及</p>
        <button id="indulgeBtn" class="indulge-button" type="button">
          <span>【放纵进入】</span>
        </button>
      </div>
    </section>

    <!-- Screen 4: 当头棒喝 -->
    <section class="screen screen--four" data-screen="4" aria-label="第四步：终章警告">
      <div class="doom-copy">
        <div class="doom-marker">青年成长与自我探索档案 · 终章</div>
        <h1>少年，当止步！</h1>
        <div class="doom-line"></div>
        <p id="warningText" class="doom-warning"></p>
        <button id="resetBtn" class="regret-button" type="button">洗心革面 / 重新开始</button>
        <div class="doom-foot">克己 · 慎独 · 惜时 · 明志</div>
      </div>
    </section>

    <div id="strobeOverlay" class="strobe-overlay" aria-hidden="true"></div>
  </div>

  <script>
    (() => {
      const app = document.getElementById('app');
      const nameForm = document.getElementById('nameForm');
      const nameInput = document.getElementById('nameInput');
      const nameError = document.getElementById('nameError');
      const tagCloud = document.getElementById('tagCloud');
      const particleField = document.getElementById('particleField');
      const indulgeBtn = document.getElementById('indulgeBtn');
      const warningText = document.getElementById('warningText');
      const resetBtn = document.getElementById('resetBtn');
      const strobeOverlay = document.getElementById('strobeOverlay');

      const screens = Array.from(document.querySelectorAll('.screen'));
      let personName = '';
      let currentScreen = 1;
      let isTransitioning = false;
      let particlesCreated = false;

      const orientationTags = [
        '异性恋', '同性恋', '双性恋', '泛性恋', '无性恋',
        '灰色无性恋', '半性恋', '流动取向', '多性恋', '自体恋',
        '智性恋', '纸性恋', '镜像性恋', 'cupio向', 'crush向',
        '双浪漫异性恋', '浪漫异性向', '浪漫同性向', '双浪漫向', '泛浪漫向',
        '无浪漫倾向', '灰色浪漫向', '半浪漫向', '多浪漫向', '跨性别',
        '非二元性别', '双性人', '酷儿', '疑问阶段', '其他／探索中'
      ];

      function escapeHTML(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderTags() {
        const fragment = document.createDocumentFragment();
        orientationTags.forEach((label, index) => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'tag-chip';
          chip.style.setProperty('--hue', String((index * 37 + 185) % 360));
          chip.dataset.label = label;
          chip.setAttribute('aria-label', `选择标签：${label}`);

          const num = document.createElement('span');
          num.className = 'index';
          num.textContent = String(index + 1).padStart(2, '0');

          const text = document.createElement('span');
          text.textContent = label;

          chip.appendChild(num);
          chip.appendChild(text);
          fragment.appendChild(chip);
        });
        tagCloud.appendChild(fragment);
      }

      function buildTagCloud() {
        tagCloud.addEventListener('click', (event) => {
          const chip = event.target.closest('.tag-chip');
          if (!chip || isTransitioning) return;
          const selected = chip.dataset.label || '其他／探索中';
          subtleRecord(selected);
          goTo(3);
        });
      }

      function subtleRecord(label) {
        // 当前仅用于流程记录，可替换为统计、埋点或本地存储。
        console.info('[认知档案] 已记录取向标签：', label);
      }

      function goTo(targetNumber) {
        if (isTransitioning || targetNumber === currentScreen) return;
        isTransitioning = true;

        const current = screens.find((s) => Number(s.dataset.screen) === currentScreen);
        const next = screens.find((s) => Number(s.dataset.screen) === targetNumber);

        if (!current || !next) {
          isTransitioning = false;
          return;
        }

        current.classList.remove('active');
        current.classList.add('leaving');

        window.setTimeout(() => {
          current.classList.remove('leaving');
          current.classList.remove('active');
          next.classList.add('active');
          currentScreen = targetNumber;
          isTransitioning = false;

          if (targetNumber === 3 && !particlesCreated) {
            createParticles();
            particlesCreated = true;
          }
        }, current === next ? 0 : 480);
      }

      function createParticles() {
        const colors = ['#ff00d4', '#00f0ff', '#eaff00', '#b900ff', '#00ffaa', '#ff5c00', '#ffffff'];
        const frag = document.createDocumentFragment();

        for (let i = 0; i < 42; i += 1) {
          const particle = document.createElement('span');
          particle.className = 'particle';
          const size = 3 + Math.floor(Math.random() * 8);
          const left = Math.random() * 100;
          const drift = (Math.random() - 0.5) * 150;
          const duration = 6 + Math.random() * 11;
          const delay = -(Math.random() * 14);
          const alpha = 0.16 + Math.random() * 0.62;
          const color = colors[Math.floor(Math.random() * colors.length)];

          particle.style.setProperty('--size', size + 'px');
          particle.style.setProperty('--color', color);
          particle.style.setProperty('--alpha', alpha.toFixed(2));
          particle.style.setProperty('--drift', drift + 'px');
          particle.style.setProperty('--duration', duration + 's');
          particle.style.setProperty('--delay', delay + 's');
          particle.style.left = left + 'vw';
          frag.appendChild(particle);
        }

        particleField.appendChild(frag);
      }

      function validateName() {
        const value = nameInput.value.trim();
        const isBad = value.length === 0;

        nameInput.classList.toggle('error', isBad);
        nameError.classList.toggle('show', isBad);

        if (isBad) {
          nameInput.focus();
          return false;
        }

        personName = value;
        return true;
      }

      nameForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!validateName()) return;
        goTo(2);
      });

      nameInput.addEventListener('input', () => {
        nameInput.classList.remove('error');
        nameError.classList.remove('show');
      });

      nameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          nameForm.dispatchEvent(new Event('submit', { cancelable: true }));
        }
      });

      function igniteNeonFall() {
        if (isTransitioning) return;
        isTransitioning = true;

        // 剧烈闪烁、震动，切断 Screen 3 的一切声色。
        strobeOverlay.classList.add('run');
        app.classList.add('shaking');

        if (navigator.vibrate) {
          try {
            navigator.vibrate([30, 35, 70, 45, 120]);
          } catch (_) {
            // 无振动权限时静默忽略。
          }
        }

        window.setTimeout(() => {
          const three = screens.find((s) => Number(s.dataset.screen) === 3);
          const four = screens.find((s) => Number(s.dataset.screen) === 4);

          if (three) {
            three.classList.remove('active');
          }

          if (four) {
            four.classList.add('active');
          }

          currentScreen = 4;
          updateWarningText();
        }, 420);

        window.setTimeout(() => {
          strobeOverlay.classList.remove('run');
          app.classList.remove('shaking');
          isTransitioning = false;
        }, 820);
      }

      indulgeBtn.addEventListener('click', igniteNeonFall);

      function updateWarningText() {
        const safeName = escapeHTML(personName || '朋友');
        warningText.innerHTML = `<span class="name">${safeName}</span>，繁华声色皆是过眼云烟，贪欢一时终耗少年精气神。\n人生非苦于无欲，而苦于纵欲无度。\n韶华易逝，莫让放纵掏空了你的身躯，莫让杂念蒙蔽了你的志向。\n节欲以养德，克己以成人。回首正道，读书强己，方为正途！`;
      }

      resetBtn.addEventListener('click', () => {
        if (isTransitioning) return;

        // 关闭屏 4 的 all 状态，静默回到最初的严肃档案。
        const four = screens.find((s) => Number(s.dataset.screen) === 4);
        const one = screens.find((s) => Number(s.dataset.screen) === 1);

        if (four) four.classList.remove('active');
        if (one) one.classList.add('active');

        nameInput.value = '';
        personName = '';
        currentScreen = 1;
        isTransitioning = false;
        nameInput.classList.remove('error');
        nameError.classList.remove('show');
        nameInput.focus();
        window.scrollTo({ top: 0, behavior: 'instant' });
      });

      renderTags();
      buildTagCloud();
      updateWarningText();
    })();
  </script>
</body>
</html>
